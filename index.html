<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Батракан</title>
<style>
  :root{
    --фон:        #0E0906;
    --дерево:     #6B2E0E;
    --свет:       #E8862F;
    --блик:       #F2A44B;
    --бумага:     #F2EBDB;
    --бумага-тень:#E4D8C0;
    --линейка:    #BCAE8E;
    --чернила:    #2A1D12;
    --бирюза:     #2A6B72;
    --бирюза-тьма:#1E4B52;
    --печать:     #B03A36;
    --субтитр-фон:#1C1A1E;
  }
  body{font-family:monospace;font-size:13px;margin:0;padding:14px;background:var(--фон);color:var(--бумага);}
  .light-spot{position:fixed;top:0;left:0;right:0;height:60vh;background:radial-gradient(circle at 50% 0%, rgba(232,134,47,0.34), transparent 60%);pointer-events:none;z-index:0;}
  .vignette{position:fixed;top:0;left:0;right:0;bottom:0;background:radial-gradient(circle, transparent 55%, rgba(0,0,0,0.55) 100%);pointer-events:none;z-index:0;}
  #app{position:relative;z-index:1;}

  .box{
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;
    box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    color:var(--чернила);padding:8px;margin-bottom:10px;
  }
  .row{margin-bottom:6px;border-bottom:1px dashed var(--линейка);padding-bottom:6px;}
  .row:last-child{border-bottom:none;}
  button{font-family:monospace;margin-right:6px;padding:2px 10px;cursor:pointer;background:var(--бумага-тень);border:1px solid var(--чернила);color:var(--чернила);border-radius:2px;}
  button:disabled{cursor:default;opacity:0.5;}
  input[type=text]{font-family:monospace;padding:2px;background:var(--бумага);border:1px solid var(--линейка);color:var(--чернила);}
  .log-entry{border-top:1px dashed var(--линейка);padding:6px 0;}
  .small{font-size:11px;color:var(--чернила);opacity:0.75;}
  .msg{font-weight:bold;}
  .lore{font-style:italic;}
  h1,h2,h3{margin:6px 0;}
  .header-line{font-size:15px;font-weight:bold;margin-bottom:10px;color:var(--бумага);}
  .footer-line{font-size:11px;color:var(--линейка);margin-top:16px;}
  .hint-line{font-size:12px;color:var(--блик);margin-top:4px;}

  .hand-scroll{overflow-x:auto;padding-bottom:6px;}
  .hand-row{display:flex;flex-wrap:nowrap;gap:8px;}
  .backlog-card{
    flex:0 0 150px;width:150px;height:180px;box-sizing:border-box;
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    overflow:hidden;position:relative;font-size:12px;cursor:pointer;color:var(--чернила);
  }
  .backlog-card.armed{box-shadow:0 0 0 2px var(--чернила), 0 14px 40px rgba(0,0,0,0.75);}
  .backlog-card.discardable{box-shadow:0 0 0 2px var(--печать), 0 14px 40px rgba(0,0,0,0.75);}
  .backlog-card.dumpable{box-shadow:0 0 0 2px var(--бирюза-тьма), 0 14px 40px rgba(0,0,0,0.75);}
  .card-art{height:96px;position:relative;display:flex;align-items:center;justify-content:center;}
  .card-art.type-trud{background:color-mix(in srgb, var(--свет) 35%, var(--бумага-тень));}
  .card-art.type-pokazuha{background:color-mix(in srgb, var(--бирюза) 35%, var(--бумага-тень));}
  .card-hours-badge{position:absolute;top:6px;left:6px;background:var(--чернила);color:var(--бумага);font-size:11px;line-height:1;padding:2px 6px;}
  .card-body{padding:6px 8px;}
  .card-name{font-size:12px;font-weight:bold;line-height:1.15;height:2.3em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .card-rule{border-top:1px solid var(--линейка);margin:5px 0;}
  .card-numbers{display:flex;justify-content:space-between;align-items:baseline;}
  .card-numbers .base{font-size:20px;font-weight:bold;}
  .card-numbers .mult{font-size:15px;color:var(--бирюза-тьма);font-weight:bold;}

  .item-slots{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
  .item-slot{
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    color:var(--чернила);padding:6px;width:220px;font-size:11px;
  }
  .item-slot.empty{background:none;box-shadow:none;border:1px dashed var(--линейка);color:var(--линейка);display:flex;align-items:center;justify-content:center;min-height:40px;}

  .calendar-wrap{display:block;width:100%;}
  .calendar{
    display:grid;grid-template-columns:56px 1fr;grid-auto-rows:34px;
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    width:100%;color:var(--чернила);
  }
  .hour-label{grid-column:1;border-bottom:1px dashed var(--линейка);border-right:1px solid var(--линейка);font-size:11px;padding:2px 4px;}
  .hour-cell{grid-column:2;border-bottom:1px dashed var(--линейка);font-size:10px;color:var(--чернила);opacity:0.65;padding:2px 4px;}
  .hour-cell.normal{background:transparent;}
  .hour-cell.overtime{background:color-mix(in srgb, var(--печать) 18%, transparent);}
  .hour-cell.lunch{background:color-mix(in srgb, var(--линейка) 45%, transparent);}
  .hour-cell.blocked{background-image:repeating-linear-gradient(45deg, color-mix(in srgb, var(--линейка) 55%, transparent) 0, color-mix(in srgb, var(--линейка) 55%, transparent) 2px, transparent 2px, transparent 6px);}
  .task-block{grid-column:2;border:1px solid var(--чернила);padding:2px 6px;font-size:12px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:1px;color:var(--чернила);}
  .task-block.type-trud{background:color-mix(in srgb, var(--свет) 40%, var(--бумага));}
  .task-block.type-pokazuha{background:color-mix(in srgb, var(--бирюза) 40%, var(--бумага));}
  .tb-main{display:flex;justify-content:space-between;gap:6px;}
  .tb-name{font-weight:bold;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .tb-nums{flex-shrink:0;}
  .tb-ot{font-size:10px;color:var(--печать);}
  .comm-block{grid-column:2;border:1px dashed var(--печать);color:var(--печать);padding:2px 6px;font-size:11px;overflow:hidden;background:color-mix(in srgb, var(--печать) 12%, var(--бумага));cursor:default;display:flex;align-items:center;}

  .legend-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.55);display:flex;align-items:center;justify-content:center;z-index:150;}
  .legend-box{
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    padding:16px;max-width:420px;font-size:13px;color:var(--чернила);
  }
  .legend-box h3{margin-top:0;}

  .formula-bar{border:1px dashed var(--линейка);padding:8px;font-size:15px;font-weight:bold;margin-top:8px;color:var(--чернила);}

  /* ---- бумажные экраны между днями ---- */
  .paper-screen{
    background:linear-gradient(160deg, var(--бумага), var(--бумага-тень));
    border-radius:3px;
    box-shadow:0 14px 40px rgba(0,0,0,0.75), 0 0 34px rgba(232,134,47,0.16);
    color:var(--чернила);
    width:520px;max-width:100%;margin:0 auto;padding:18px 22px;position:relative;
  }
  .paper-screen h1, .paper-screen h2, .paper-screen h3{font-family:monospace;color:var(--чернила);}
  .paper-title{font-size:15px;font-weight:bold;letter-spacing:1px;margin-bottom:10px;}
  .paper-line{border-bottom:1px dashed var(--линейка);padding:6px 0;}
  .paper-line:last-child{border-bottom:none;}
  .paper-table{width:100%;border-collapse:collapse;margin:4px 0;}
  .paper-table td{border-bottom:1px dashed var(--линейка);padding:4px 2px;font-family:monospace;}
  .paper-table td:last-child{text-align:right;font-weight:bold;}
  .paper-footer{font-size:10px;color:var(--чернила);opacity:0.6;padding-top:8px;}
  .stamp{
    position:absolute;top:14px;right:18px;
    border:3px solid var(--печать);color:var(--печать);
    padding:4px 10px;font-weight:bold;font-size:16px;letter-spacing:1px;
    font-family:monospace;transform:rotate(-11deg);opacity:0.72;
    pointer-events:none;
  }

  /* ---- субтитры (сказовый текст и реакции конторки) ---- */
  .subtitle-wrap{text-align:center;margin-top:12px;}
  .subtitle{
    display:inline-block;background:var(--субтитр-фон);color:#fff;font-weight:bold;
    text-transform:uppercase;border-radius:8px;padding:7px 14px;
    font-family:monospace;text-align:center;max-width:480px;
  }
  .subtitle-toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);z-index:200;pointer-events:none;text-align:center;}
</style>
</head>
<body>
<div class="light-spot"></div>
<div class="vignette"></div>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ======================= CONFIG ======================= */
const CONFIG = {
  DAY_START_HOUR: 9,
  DAY_END_HOUR: 22,          // день физически кончается в 22:00 (последний слот начинается в 21)
  OVERTIME_START_HOUR: 18,   // всё, что >= этого часа — переработка / красная зона

  MIN_WORK_HOURS: 4,         // пол после всех сокращений

  HAND_SIZE: 8,

  RUDE_MARKS_LIMIT: 3,           // на этой отметке Алеся вычёркивает досрочно
  FORCE_MAJEURE_HOURS: [11, 12, 14, 15], // окно 11:00-16:00, обед сам себя исключает

  // Микрофорс-мажоры: раз в день, случайно, в занятый час из FORCE_MAJEURE_HOURS.
  FORCE_MAJEURE_EVENTS: [
    { key: "neighbor", label: "Сосед просит подсобить", hours: 1 },
    { key: "boss",     label: "Начальник зовёт к себе",  hours: 2 },
    { key: "jam",      label: "Бумага в машинке замялась", hours: 1 },
    { key: "foreign",  label: "Принесли чужую стопку на сверку", hours: 1 }
  ],

  // Первый порог поднят с 1500 до 2200, остальные — пропорционально (×22/15).
  THRESHOLDS: [2200, 5100, 11700, 26400, 58700],
  WEEKDAYS: ["день первый", "день второй", "день третий", "день четвёртый", "день пятый"],

  COMM_OPTIONS: [

  // Реплики-субтитры конторки: ключ события -> варианты, выбирается случайно по seed'у.
  TOASTS: {
    stayLate: ["Свет в конторке горит, батракан всё колупает.", "Вахтёрыч поглядел, да ничего не сказал."],
    leftOnTime: ["Батракан ушёл вовремя. Это запомнят."],
    emptyDay: ["Сегодня батракан ничего не наколупал. Бывает и так."],
    rude: ["Хамство твоё отмечено.", "Вахтёрыч сделал вид, что не слышал.", "В личное дело подшито."],
    bought: ["Кукиши приняты. Обещано многое."],
    commOrder: ["За усердие батракану назначено общение."],
    thresholdMet: ["Квартал сдан. Хозяин доволен, надо полагать."],
    thresholdAtRisk: ["Недоимка растёт. Алеся дело полистывает."]
  },

  // Колода: 40 циферок, распределение и величины — из задания, не менять формулу.
  DECK_SPEC: [
    { key: "trud_small",  type: "trud",     sizeLabel: "копошение в листочках", hours: 1, base: 10, mult: 1,
      names: ["Подшить бумажку","Пересчитать скрепки","Протереть печать","Свериться с указом","Отписаться в журнал","Заштриховать клетку","Прошнуровать дело","Отмерить чернил"] },
    { key: "trud_medium", type: "trud",     sizeLabel: "размусоливание букв",   hours: 2, base: 30, mult: 1,
      names: ["Составить отписку","Свести баланс по циферкам","Заполнить требу","Обойти три конторы","Сверить два реестра","Начертать табель","Уложить кипу в стопу","Дозвониться до соседней конторки","Переписать черновик наново"] },
    { key: "trud_large",  type: "trud",     sizeLabel: "корпение",              hours: 3, base: 48, mult: 2,
      names: ["Собрать квартальный свод","Разобрать завал прошлого лета","Вывести дело из тупика","Согласовать с тремя конторками","Перелопатить архив","Свершить годовой перечёт"] },
    { key: "trud_epic",   type: "trud",     sizeLabel: "гора батрачки",         hours: 4, base: 68, mult: 2,
      names: ["Поднять дело из мёртвых","Учинить ревизию всей конторки","Совершить подвиг во имя квартала"] },
    { key: "pok_small",   type: "pokazuha", sizeLabel: "показуха мелкая",  hours: 1, base: 4,  mult: 2,
      names: ["Улыбнуться начальству","Ответить бодро в чате","Поставить себя в копию","Кивнуть на совещании","Похвалить чужой отчёт","Явиться пораньше для виду"] },
    { key: "pok_medium",  type: "pokazuha", sizeLabel: "показуха средняя", hours: 2, base: 10, mult: 4,
      names: ["Составить красивую презентацию","Отписаться всем сразу","Явиться на совещание без дела","Разослать бодрый отчёт о ничём","Затеять разговор о нагрузке"] },
    { key: "pok_large",   type: "pokazuha", sizeLabel: "показуха крупная", hours: 3, base: 15, mult: 6,
      names: ["Выступить перед директорским приказом","Устроить показательное усердие","Затмить соседа на общем сходе"] }
  ],

  // Предметы в конторке за кукиши. oneTime — расходуется и пропадает из слота.
  ITEMS: [
    { id: "otgul",      name: "«Отгул»",                price: 10, desc: "Одноразово: сжигает 6 Выгорания, забирает весь день целиком.", oneTime: true },
    { id: "pechat",     name: "«Казённая печать»",      price: 20, desc: "+2 Замечено за каждую сыгранную показуху в этот день." },
    { id: "kofeinik",   name: "«Кофейник»",             price: 25, desc: "+1 час к рабочему дню — без Выгорания и без кукишей." },
    { id: "valerianka", name: "«Валерьянка»",           price: 35, desc: "Одноразово: сжигает 3 Выгорания, дня не отбирает.", oneTime: true },
    { id: "kudesnitsa", name: "«Кудесница благоволит»", price: 50, desc: "×1.5 к Замечено. Благоволение держится " + 3 + " квартала, потом истает." }
  ]
};

CONFIG.NORMAL_HOURS = [9, 10, 11, 12, 14, 15, 16, 17]; // 8 слотов 9-18 без обеда
CONFIG.OVERTIME_HOURS = [18, 19, 20, 21];              // 4 слота 18-22

CONFIG.CARDS = (function buildCards(){
  const list = [];
  CONFIG.DECK_SPEC.forEach(spec => {
    spec.names.forEach((name, i) => {
      list.push({ id: spec.key + "_" + i, name, type: spec.type, sizeLabel: spec.sizeLabel, hours: spec.hours, base: spec.base, mult: spec.mult });
    });
  });
  return list;
})();

function itemDef(id){ return CONFIG.ITEMS.find(j => j.id === id); }
function countOwned(itemSlots, id){ return itemSlots.filter(s => s.id === id).length; }
function fmt(n){ return Math.round(n * 100) / 100; }

// Заглушки: один набор примитивных SVG-иконок по типу, заменить позже.
const ICONS = {
  trud: `<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="6" width="24" height="32" rx="2" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="15" y1="15" x2="29" y2="15" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="15" y1="22" x2="29" y2="22" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="15" y1="29" x2="24" y2="29" stroke="var(--чернила)" stroke-width="2"/>
  </svg>`,
  pokazuha: `<svg width="44" height="44" viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
    <circle cx="22" cy="22" r="9" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="22" y1="4" x2="22" y2="9" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="22" y1="35" x2="22" y2="40" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="4" y1="22" x2="9" y2="22" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="35" y1="22" x2="40" y2="22" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="9" y1="9" x2="12.5" y2="12.5" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="31.5" y1="31.5" x2="35" y2="35" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="9" y1="35" x2="12.5" y2="31.5" stroke="var(--чернила)" stroke-width="2"/>
    <line x1="31.5" y1="12.5" x2="35" y2="9" stroke="var(--чернила)" stroke-width="2"/>
  </svg>`
};

/* ======================= RNG ======================= */
function hashStringToInt(str){
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  return h >>> 0;
}
function resolveSeed(input){
  const trimmed = (input || "").trim();
  if (trimmed === "") return (Date.now() % 4294967296) >>> 0;
  if (/^\d+$/.test(trimmed)) return Number(trimmed) >>> 0;
  return hashStringToInt(trimmed);
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ======================= SCORING (без комбо) ======================= */
function isItemActive(slot){
  if (slot.id === "kudesnitsa") return slot.quartersUsed <= CONFIG.KUDESNITSA_ACTIVE_QUARTERS;
  return true;
}

// Чистая функция: Наколупано × Замечено. Используется и для живой формулы, и для реального подсчёта.
function computeDayScore(cards, itemSlots){
  const resultBase = cards.reduce((s, c) => s + c.base, 0);
  const visBase = cards.reduce((s, c) => s + c.mult, 0);
  let result = resultBase;
  let vis = visBase;
  const steps = [];

  itemSlots.forEach(slot => {
    if (!slot) return;
    const def = itemDef(slot.id);
    if (slot.id === "kofeinik" || slot.id === "otgul" || slot.id === "valerianka") return; // не влияют на формулу
    if (slot.id === "kudesnitsa" && !isItemActive(slot)){
      steps.push({ name: def.name, broken: true });
      return;
    }
    const before = { result, vis };
    if (slot.id === "pechat"){
      const cnt = cards.filter(c => c.type === "pokazuha").length;
      vis += 2 * cnt;
    } else if (slot.id === "kudesnitsa"){
      vis *= 1.5;
    }
    steps.push({ name: def.name, before, after: { result, vis } });
  });

  const score = Math.round(result * vis);
  return { resultBase, visBase, steps, result, vis, score };
}

// Переработка: Выгорание и кукиши всегда начисляются парой, час к часу.
function computeOvertime(dayPlaced, itemSlots){
  const overtimeHours = [];
  dayPlaced.forEach(p => p.occupiedHours.forEach(h => {
    if (h >= CONFIG.OVERTIME_START_HOUR) overtimeHours.push(h);
  }));
  overtimeHours.sort((a, b) => a - b);
  const freeBudget = countOwned(itemSlots, "kofeinik");
  const freeHours = overtimeHours.slice(0, freeBudget);
  const paidHours = overtimeHours.slice(freeBudget);
  return { overtimeHours, freeBudget, freeHours, paidHours, burnout: paidHours.length, kukishi: paidHours.length };
}

function computeDayBlockedHours(totalBurnout){
  const shrink = Math.floor(totalBurnout / CONFIG.BURNOUT_SHRINK_PER);
  const effectiveNormal = Math.max(CONFIG.MIN_WORK_HOURS, CONFIG.BASE_WORK_HOURS - shrink);
  const blockedCount = CONFIG.BASE_WORK_HOURS - effectiveNormal;
  const blocked = blockedCount > 0 ? CONFIG.NORMAL_HOURS.slice(CONFIG.NORMAL_HOURS.length - blockedCount) : [];
  return { shrink, effectiveNormal, blocked: new Set(blocked) };
}

/* ======================= APP ======================= */
const App = {
  state: null,

  init(){
    this.state = { screen: "start", seedText: String(Date.now() % 100000) };
    this.render();
  },

  startRun(seedInput){
    const seed = resolveSeed(seedInput);
    this.state = {
      screen: "quarter",
      seed: seed,
      rng: mulberry32(seed),
      quarterIndex: 0,
      kukishi: 0,
      totalBurnout: 0,
      kudaDevatsya: 0,
      itemSlots: [],
      log: [],
      message: "",
      pendingPlaceCardId: null,
      discardMode: false,
      hamstvoMenuOpen: false,
      hamstvoDumpMode: false,
      rudeMarks: 0,
      toast: null,
      toastToken: 0,
      showLegend: false,
      legendShownOnce: false
    };
    this.newQuarter();
    this.render();
  },

  newQuarter(){
    const st = this.state;
    st.deck = shuffle(CONFIG.CARDS, st.rng);
    st.discardPile = [];
    st.playedPile = [];
    st.hand = [];
    st.quarterScore = 0;
    st.dayIndex = 0;

    st.itemSlots.forEach(slot => {
      if (slot.id === "kudesnitsa" && slot.quartersUsed <= CONFIG.KUDESNITSA_ACTIVE_QUARTERS){
        slot.quartersUsed++;
      }
    });

    st.commFlavorThisQuarter = CONFIG.COMM_OPTIONS[Math.floor(st.rng() * CONFIG.COMM_OPTIONS.length)];
    st.log.unshift({ type: "quarter-start", quarter: st.quarterIndex + 1, threshold: CONFIG.THRESHOLDS[st.quarterIndex] });
    st.screen = "order";
    this.showToast("commOrder");
  },

  showToast(key){
    const options = CONFIG.TOASTS[key];
    if (!options || !options.length){ this.render(); return; }
    const text = options[Math.floor(this.state.rng() * options.length)];
    this.showExactToast(text);
  },

  showExactToast(text){
    const st = this.state;
    st.toastToken = (st.toastToken || 0) + 1;
    const token = st.toastToken;
    st.toast = { text };
    this.render();
    setTimeout(() => {
      if (this.state.toast && this.state.toastToken === token){
        this.state.toast = null;
        this.render();
      }
    }, 2000);
  },

  acknowledgeOrder(){
    this.newDay();
    this.render();
  },

  newDay(){
    const st = this.state;
    st.screen = "day-intro";
    st.dayPlaced = [];
    st.discardsUsedToday = 0;
    st.message = "";
    st.pendingPlaceCardId = null;
    st.discardMode = false;
    st.hamstvoMenuOpen = false;
    st.hamstvoDumpMode = false;

    const blockInfo = computeDayBlockedHours(st.totalBurnout);
    st.dayBlockedHours = blockInfo.blocked;
    st.dayShrink = blockInfo.shrink;
    st.dayEffectiveHours = blockInfo.effectiveNormal;

    if (st.dayIndex === 0){
      st.forcedBlock = { startHour: 9, hours: 2, occupiedHours: [9, 10], label: st.commFlavorThisQuarter };
      st.log.unshift({ type: "comm-order", quarter: st.quarterIndex + 1, flavor: st.commFlavorThisQuarter });
    } else {
      st.forcedBlock = null;
    }
  },

  beginDay(){
    const st = this.state;
    this.dealHand();
    st.log.unshift({
      type: "day-start", quarter: st.quarterIndex + 1, day: st.dayIndex + 1,
      weekday: CONFIG.WEEKDAYS[st.dayIndex], blocked: [...st.dayBlockedHours]
    });
    st.screen = "day";
    if (!st.legendShownOnce){
      st.showLegend = true;
      st.legendShownOnce = true;
    }
    this.render();
  },

  dealHand(){
    const st = this.state;
    while (st.hand.length < CONFIG.HAND_SIZE && st.deck.length > 0){
      st.hand.push(st.deck.shift());
    }
  },

  occupiedHoursSoFar(){
    const st = this.state;
    const occ = new Set(st.dayPlaced.flatMap(p => p.occupiedHours));
    if (st.forcedBlock) st.forcedBlock.occupiedHours.forEach(h => occ.add(h));
    return occ;
  },

  armCard(cardId){
    const st = this.state;
    const card = st.hand.find(c => c.id === cardId);
    if (!card) return;
    st.pendingPlaceCardId = cardId;
    st.discardMode = false;
    st.message = "Выбрана циферка «" + card.name + "». Кликни на свободную ячейку (или перетащи туда).";
    this.render();
  },

  toggleDiscardMode(){
    const st = this.state;
    if (st.discardMode){
      st.discardMode = false;
      st.message = "";
      this.render();
      return;
    }
    if (st.discardsUsedToday >= CONFIG.DISCARDS_PER_DAY){
      st.message = "На сегодня соседи кончились."; this.render(); return;
    }
    st.discardMode = true;
    st.pendingPlaceCardId = null;
    st.message = "Режим спихивания включён — кликни по циферке в руке.";
    this.render();
  },

  discardOneCard(cardId){
    const st = this.state;
    const card = st.hand.find(c => c.id === cardId);
    if (!card || !st.discardMode) return;
    st.discardPile.push(card);
    st.hand = st.hand.filter(c => c.id !== cardId);
    st.discardsUsedToday++;
    st.discardMode = false;
    st.message = "";
    st.log.unshift({ type: "discard", day: st.dayIndex + 1, cards: [card], used: st.discardsUsedToday });
    this.render();
  },

  /* ---- Хамство ---- */
  toggleHamstvoMenu(){
    const st = this.state;
    st.hamstvoMenuOpen = !st.hamstvoMenuOpen;
    this.render();
  },

  applyRudeConsequence(note, toastOverride){
    const st = this.state;
    st.kudaDevatsya += 3;
    st.rudeMarks = (st.rudeMarks || 0) + 1;
    st.log.unshift({ type: "rude", day: st.dayIndex + 1, note, marks: st.rudeMarks });
    const ended = st.rudeMarks >= CONFIG.RUDE_MARKS_LIMIT;
    if (ended) st.screen = "vycherknut-marks";
    if (toastOverride) this.showExactToast(toastOverride); else this.showToast("rude");
    return ended;
  },

  hamstvoRefuseComm(){
    const st = this.state;
    if (!st.forcedBlock) return;
    st.forcedBlock = null;
    st.hamstvoMenuOpen = false;
    this.applyRudeConsequence("отказался от общения");
  },

  hamstvoSkipDay(){
    const st = this.state;
    st.dayPlaced.forEach(p => st.hand.push(p.card));
    st.dayPlaced = [];
    st.hamstvoMenuOpen = false;
    const ended = this.applyRudeConsequence("не сдал день");
    if (!ended) this.advanceDay();
  },

  toggleHamstvoDumpMode(){
    const st = this.state;
    if (st.hamstvoDumpMode){
      st.hamstvoDumpMode = false;
      st.hamstvoMenuOpen = false;
      this.render();
      return;
    }
    if (st.hand.length < 1) return;
    st.hamstvoDumpMode = true;
    st.pendingPlaceCardId = null;
    st.discardMode = false;
    st.hamstvoMenuOpen = false;
    st.message = "Выбери циферку, чтобы спихнуть начальнику.";
    this.render();
  },

  hamstvoDumpCard(cardId){
    const st = this.state;
    const card = st.hand.find(c => c.id === cardId);
    if (!card || !st.hamstvoDumpMode) return;
    st.discardPile.push(card);
    st.hand = st.hand.filter(c => c.id !== cardId);
    st.hamstvoDumpMode = false;
    st.message = "";
    this.applyRudeConsequence("спихнул циферку начальнику: " + card.name);
  },

  placeCard(cardId, startHour){
    const st = this.state;
    const card = st.hand.find(c => c.id === cardId);
    if (!card){ this.render(); return; }
    const duration = card.hours;
    const occ = [];
    for (let h = startHour; h < startHour + duration; h++) occ.push(h);

    if (occ.some(h => h < CONFIG.DAY_START_HOUR || h >= CONFIG.DAY_END_HOUR)){
      st.message = "Циферка не влезает в день (граница — 22:00)."; this.render(); return;
    }
    if (occ.includes(CONFIG.LUNCH_HOUR)){
      st.message = "Циферка попадает на обед (13:00) — недоступно."; this.render(); return;
    }
    if (occ.some(h => st.dayBlockedHours.has(h))){
      st.message = "Часть слотов недоступна из-за накопленного Выгорания."; this.render(); return;
    }
    const occupiedSoFar = this.occupiedHoursSoFar();
    if (occ.some(h => occupiedSoFar.has(h))){
      st.message = "Слот уже занят."; this.render(); return;
    }

    st.hand = st.hand.filter(c => c.id !== cardId);
    st.dayPlaced.push({ card, startHour, occupiedHours: occ });
    st.pendingPlaceCardId = null;
    st.message = "";
    this.render();
  },

  handleDrop(cardId, startHour){ this.placeCard(cardId, startHour); },

  onCellClick(startHour){
    const st = this.state;
    if (!st.pendingPlaceCardId){
      st.message = "Сначала кликни по циферке в руке, потом по ячейке."; this.render(); return;
    }
    this.placeCard(st.pendingPlaceCardId, startHour);
  },

  onForcedBlockClick(){
    this.state.message = "Приказ есть приказ — общение не отменить.";
    this.render();
  },

  unplaceCard(cardId){
    const st = this.state;
    const idx = st.dayPlaced.findIndex(p => p.card.id === cardId);
    if (idx === -1) return;
    const p = st.dayPlaced[idx];
    st.dayPlaced.splice(idx, 1);
    st.hand.push(p.card);
    this.render();
  },

  findForceMajeureCandidates(){
    const st = this.state;
    const eligible = new Set(CONFIG.FORCE_MAJEURE_HOURS);
    const pairs = [];
    st.dayPlaced.forEach(p => {
      p.occupiedHours.forEach(h => {
        if (eligible.has(h)) pairs.push({ hour: h, card: p.card });
      });
    });
    return pairs;
  },

  submitDay(){
    const st = this.state;
    const candidates = this.findForceMajeureCandidates();
    if (candidates.length > 0){
      const hourPick = candidates[Math.floor(st.rng() * candidates.length)];
      const events = CONFIG.FORCE_MAJEURE_EVENTS;
      const eventPick = events[Math.floor(st.rng() * events.length)];
      st.pendingForceMajeure = {
        hour: hourPick.hour, cardId: hourPick.card.id,
        label: eventPick.label, hoursEaten: eventPick.hours
      };
      st.screen = "force-majeure";
      this.render();
      return;
    }
    this.finalizeDay();
  },

  forceMajeureHelp(){
    const st = this.state;
    const fm = st.pendingForceMajeure;
    if (!fm) return;
    const affected = st.dayPlaced.find(p => p.card.id === fm.cardId);
    const boundary = affected ? affected.startHour : fm.hour;
    const shift = fm.hoursEaten;
    const burned = [];
    const shifted = [];
    st.dayPlaced.forEach(p => {
      if (p.startHour < boundary){ shifted.push(p); return; }
      const newStart = p.startHour + shift;
      const newOcc = [];
      for (let h = newStart; h < newStart + p.card.hours; h++) newOcc.push(h);
      const fits = (newStart + p.card.hours - 1) < CONFIG.DAY_END_HOUR && !newOcc.includes(CONFIG.LUNCH_HOUR);
      if (fits) shifted.push({ card: p.card, startHour: newStart, occupiedHours: newOcc });
      else burned.push(p.card);
    });
    st.dayPlaced = shifted;
    st.log.unshift({
      type: "force-majeure", day: st.dayIndex + 1, label: fm.label, choice: "help",
      hoursEaten: shift, burned: burned.map(c => c.name)
    });
    st.pendingForceMajeure = null;
    this.finalizeDay(true);
    this.showExactToast("Батракан подсобил. Кто ж ещё.");
  },

  forceMajeureRude(){
    const st = this.state;
    const fm = st.pendingForceMajeure;
    if (!fm) return;
    st.log.unshift({ type: "force-majeure", day: st.dayIndex + 1, label: fm.label, choice: "rude", hoursEaten: 0, burned: [] });
    // pendingForceMajeure остаётся заполненным пока экран всё ещё "force-majeure" —
    // applyRudeConsequence сразу рендерит тост, и обнулять его раньше нельзя (упадёт renderForceMajeure).
    const ended = this.applyRudeConsequence("нахамил из-за форс-мажора: " + fm.label, "Хамство твоё отмечено.");
    st.pendingForceMajeure = null;
    if (!ended) this.finalizeDay(true);
  },

  finalizeDay(skipAutoToast){
    const st = this.state;
    const cards = st.dayPlaced.map(p => p.card);
    const scoreInfo = computeDayScore(cards, st.itemSlots);
    const otInfo = computeOvertime(st.dayPlaced, st.itemSlots);

    const normalHoursToday = CONFIG.NORMAL_HOURS.filter(h => !st.dayBlockedHours.has(h));
    const occupied = this.occupiedHoursSoFar();
    const emptyHours = normalHoursToday.filter(h => !occupied.has(h));
    st.kudaDevatsya += emptyHours.length;

    st.playedPile.push(...cards);
    st.quarterScore += scoreInfo.score;
    st.totalBurnout += otInfo.burnout;
    st.kukishi += otInfo.kukishi;

    st.log.unshift({
      type: "day-end", quarter: st.quarterIndex + 1, day: st.dayIndex + 1,
      cards, scoreInfo, otInfo, emptyHours: emptyHours.length,
      runningTotal: st.quarterScore, totalBurnout: st.totalBurnout, kukishi: st.kukishi
    });

    const isLastDayOfQuarter = st.dayIndex === CONFIG.DAYS_PER_QUARTER - 1;
    const thresholdFailed = isLastDayOfQuarter && st.quarterScore < CONFIG.THRESHOLDS[st.quarterIndex];
    st.dayOutro = {
      dayNumber: st.dayIndex + 1,
      weekday: CONFIG.WEEKDAYS[st.dayIndex],
      result: scoreInfo.result,
      vis: scoreInfo.vis,
      score: scoreInfo.score,
      overtimeHours: otInfo.overtimeHours.length,
      burnoutGained: otInfo.burnout,
      kukishiGained: otInfo.kukishi,
      quarterScore: st.quarterScore,
      threshold: CONFIG.THRESHOLDS[st.quarterIndex],
      thresholdFailed
    };
    st.screen = "day-outro";

    if (skipAutoToast){ this.render(); return; }
    let toastKey = null;
    if (cards.length === 0) toastKey = "emptyDay";
    else if (otInfo.overtimeHours.length === 0) toastKey = "leftOnTime";
    else if (st.dayPlaced.some(p => p.occupiedHours.includes(21))) toastKey = "stayLate";
    const remainingDaysAfter = CONFIG.DAYS_PER_QUARTER - (st.dayIndex + 1);
    if (remainingDaysAfter === 2 && st.quarterScore < CONFIG.THRESHOLDS[st.quarterIndex] / 2){
      toastKey = "thresholdAtRisk";
    }
    if (toastKey) this.showToast(toastKey);
    else this.render();
  },

  continueAfterDayOutro(){
    this.state.dayOutro = null;
    this.advanceDay();
  },

  useOneTimeItem(slotIdx){
    const st = this.state;
    const slot = st.itemSlots[slotIdx];
    if (!slot) return;
    const def = itemDef(slot.id);
    if (!def || !def.oneTime) return;

    const eatsDay = slot.id === "otgul";
    const burnAmount = slot.id === "otgul" ? 6 : (slot.id === "valerianka" ? 3 : 0);

    if (eatsDay){
      st.dayPlaced.forEach(p => st.hand.push(p.card));
      st.dayPlaced = [];
    }
    st.itemSlots.splice(slotIdx, 1);
    const before = st.totalBurnout;
    st.totalBurnout = Math.max(0, st.totalBurnout - burnAmount);

    st.log.unshift({ type: "onetime-item", name: def.name, day: st.dayIndex + 1, before, after: st.totalBurnout, eatsDay });

    if (eatsDay) this.advanceDay();
    else this.render();
  },

  advanceDay(){
    const st = this.state;
    st.dayIndex++;
    if (st.dayIndex >= CONFIG.DAYS_PER_QUARTER) this.endQuarter();
    else this.newDay();
    this.render();
  },

  endQuarter(){
    const st = this.state;
    const threshold = CONFIG.THRESHOLDS[st.quarterIndex];
    const passed = st.quarterScore >= threshold;
    st.log.unshift({ type: "quarter-end", quarter: st.quarterIndex + 1, threshold, score: st.quarterScore, passed });

    if (st.quarterIndex === CONFIG.THRESHOLDS.length - 1){
      st.finalePassedThreshold = passed;
      st.finaleEnough = st.kudaDevatsya >= CONFIG.FINALE_THRESHOLD;
      st.screen = "finale";
      if (passed) this.showToast("thresholdMet");
      return;
    }

    if (!passed){
      st.screen = "gameover-early";
      return;
    }

    st.shopOffers = Array.from({ length: CONFIG.SHOP_SIZE }, () => {
      const def = CONFIG.ITEMS[Math.floor(st.rng() * CONFIG.ITEMS.length)];
      return { id: def.id, bought: false };
    });
    st.screen = "shop";
    this.showToast("thresholdMet");
  },

  buyItem(offerIdx){
    const st = this.state;
    const offer = st.shopOffers[offerIdx];
    if (!offer || offer.bought) return;
    const def = itemDef(offer.id);
    if (st.kukishi < def.price){ st.message = "Не хватает кукишей."; this.render(); return; }
    if (st.itemSlots.length >= CONFIG.MAX_ITEM_SLOTS){ st.message = "Все слоты заняты."; this.render(); return; }
    st.kukishi -= def.price;
    st.itemSlots.push({ id: def.id, quartersUsed: 0 });
    offer.bought = true;
    st.message = "";
    this.showToast("bought");
  },

  moveItemSlot(idx, dir){
    const st = this.state;
    const j = idx + dir;
    if (j < 0 || j >= st.itemSlots.length) return;
    const tmp = st.itemSlots[idx];
    st.itemSlots[idx] = st.itemSlots[j];
    st.itemSlots[j] = tmp;
    this.render();
  },

  continueToNextQuarter(){
    const st = this.state;
    st.quarterIndex++;
    this.newQuarter();
    this.render();
  },

  restart(){ this.init(); },

  /* ======================= RENDER ======================= */
  render(){
    const st = this.state;
    let html = "";
    if (st.screen === "start") html = this.renderStart();
    else if (st.screen === "order") html = this.renderOrder();
    else if (st.screen === "day-intro") html = this.renderDayIntro();
    else if (st.screen === "day") html = this.renderDay();
    else if (st.screen === "day-outro") html = this.renderDayOutro();
    else if (st.screen === "force-majeure") html = this.renderForceMajeure();
    else if (st.screen === "shop") html = this.renderShop();
    else if (st.screen === "gameover-early") html = this.renderGameOverEarly();
    else if (st.screen === "finale") html = this.renderFinale();
    else if (st.screen === "vycherknut-marks") html = this.renderVycherknutMarks();
    if (st.showLegend) html += this.renderLegend();
    if (st.toast) html += this.renderToast();
    document.getElementById("app").innerHTML = html;
  },

  renderSubtitle(text){
    return `<div class="subtitle-wrap"><div class="subtitle">${text}</div></div>`;
  },

  renderToast(){
    return `<div class="subtitle-toast"><div class="subtitle">${this.state.toast.text}</div></div>`;
  },

  renderLegend(){
    return `<div class="legend-overlay">
      <div class="legend-box">
        <h3>Как читать циферку</h3>
        <div class="row">Число в тёмной плашке в углу арта — часы: сколько займёт в календаре.</div>
        <div class="row">Крупное число внизу карты — Наколупано (складывается в Результат).</div>
        <div class="row">Число со знаком «+» — Замечено (складывается в Множитель).</div>
        <div class="row">Очки дня = сумма Наколупано × сумма Замечено по всем сыгранным циферкам.</div>
        <div class="row">В календаре то же самое в одну строку: «48 · +2» — Наколупано 48, Замечено +2.</div>
        <button data-action="close-legend">Понятно</button>
      </div>
    </div>`;
  },

  renderStamp(label){
    return `<div class="stamp">${label}</div>`;
  },

  renderOrder(){
    const st = this.state;
    return `
      <div class="paper-screen">
        <div class="paper-title">ПРИКАЗ №${st.quarterIndex + 1}</div>
        <div class="paper-line"><button data-action="acknowledge-order">Принять к исполнению</button></div>
      </div>
      ${this.renderSubtitle("Свыше пришла воля, обжалованию не подлежит. За усердие батракану назначено общение: " + st.commFlavorThisQuarter + ".")}
    `;
  },

  renderDayIntro(){
    return `
      <div class="paper-screen">
        <div class="paper-title">БАТРАКАН</div>
        <div class="paper-line"><button data-action="begin-day">Батраканить</button></div>
      </div>
      ${this.renderSubtitle("А ты и не заметил, как наступил очередной день в конторке. Впереди гора батрачки. Какая же благодать — шабашить в любимой конторке на благо хозяина. Авось ещё и кукишей да обещаний подкинут пуще прежнего.")}
    `;
  },

  renderDayOutro(){
    const o = this.state.dayOutro;
    let line3, stampLabel;
    if (o.thresholdFailed){ line3 = "Ты устал, оно и понятно."; stampLabel = "НЕДОИМКА"; }
    else if (o.overtimeHours >= 3){ line3 = "Вахтёрыч на выходе уже и не глядит."; stampLabel = "СВЕРХУРОЧНО"; }
    else if (o.overtimeHours >= 1){ line3 = "Вахтёрыч на выходе устало кивнул, он тоже утомился бдеть."; stampLabel = "СДАНО"; }
    else { line3 = "Вахтёрыч на выходе кивнул, дивясь."; stampLabel = "СДАНО"; }

    return `
      <div class="paper-screen">
        ${this.renderStamp(stampLabel)}
        <div class="paper-title" style="padding-right:110px">КОНТОРКА · ОТДЕЛ КВАДРОВ / СВОДКА ЗА ДЕНЬ</div>
        <table class="paper-table">
          <tr><td>День</td><td>${o.dayNumber}/${CONFIG.DAYS_PER_QUARTER} (${o.weekday})</td></tr>
          <tr><td>Наколупано</td><td>${o.result}</td></tr>
          <tr><td>Замечено</td><td>+${fmt(o.vis)}</td></tr>
          <tr><td>Итог дня</td><td>${o.score}</td></tr>
          <tr><td>Переработка</td><td>${o.overtimeHours}ч</td></tr>
          <tr><td>Выгорание</td><td>+${o.burnoutGained}</td></tr>
          <tr><td>Кукиши</td><td>+${o.kukishiGained}</td></tr>
          <tr><td>Квартал</td><td>${o.quarterScore} / ${o.threshold}</td></tr>
        </table>
        <div class="paper-footer">ф. 17-Б · экз. единственный</div>
        <div class="paper-line"><button data-action="continue-day-outro">Домой</button></div>
      </div>
      ${this.renderSubtitle("Ты сделал это, ты своё отшабашкал. Циферки накалупаны, бурмалда набережена, аккуратно сконтейнированы. " + line3 + " Отдыхай, батракан. Скоро свидимся.")}
    `;
  },

  renderForceMajeure(){
    const fm = this.state.pendingForceMajeure;
    return `
      <div class="paper-screen">
        <div class="paper-title">БАТРАКАН</div>
        <table class="paper-table">
          <tr><td>Что стряслось</td><td>${fm.label}</td></tr>
          <tr><td>Час</td><td>${fm.hour}:00</td></tr>
          <tr><td>Съедает</td><td>${fm.hoursEaten}ч</td></tr>
        </table>
        <div class="paper-line">
          <button data-action="force-majeure-help">Подсобить</button>
          <button data-action="force-majeure-rude">Нахамить</button>
        </div>
      </div>
      ${this.renderSubtitle(fm.label + ".")}
    `;
  },

  renderStart(){
    const st = this.state;
    return `
      <div class="paper-screen">
        <div class="paper-title">БАТРАКАН</div>
        <div class="paper-line">Очки = Наколупано × Замечено. Пороги по кварталам: ${CONFIG.THRESHOLDS.join(", ")}.</div>
        <div class="paper-line">Seed (число или любой текст, можно оставить пустым):<br><input type="text" id="seedInput" value="${st.seedText}"></div>
        <div class="paper-line"><button data-action="start-run">Батраканить</button></div>
      </div>
      ${this.renderSubtitle("В некоторой конторке, не столь отдалённой, сидел батракан и колупал циферки. Приказы шли сверху, конца им было не видно. Директора конторки не видал ни один батракан — только его волю. Личное дело батракана лежало у Кудесницы Алеси в отделе кадров, и счёт вела она одна.")}
      ${this.renderSubtitle("Продержись год в конторке и уйди на своих ногах. Кто не удержится — того вычеркнут, и дело с концом.")}
    `;
  },

  renderItemSlots(){
    const st = this.state;
    const slotsHtml = [];
    for (let i = 0; i < CONFIG.MAX_ITEM_SLOTS; i++){
      const slot = st.itemSlots[i];
      if (!slot){ slotsHtml.push(`<div class="item-slot empty">пусто</div>`); continue; }
      const def = itemDef(slot.id);
      let status = "";
      if (slot.id === "kudesnitsa"){
        status = isItemActive(slot)
          ? " (квартал " + slot.quartersUsed + "/" + CONFIG.KUDESNITSA_ACTIVE_QUARTERS + ")"
          : " — истаяло";
      }
      const useBtn = (def.oneTime && st.screen === "day")
        ? `<div><button data-action="use-item" data-slot-idx="${i}">Использовать</button></div>`
        : "";
      slotsHtml.push(`<div class="item-slot">
        <b>${def.name}</b>${status}<br>
        <span class="small">${def.desc}</span>
        ${useBtn}
        <div>
          <button data-action="move-item-up" data-slot-idx="${i}" ${i === 0 ? "disabled" : ""}>▲</button>
          <button data-action="move-item-down" data-slot-idx="${i}" ${i === st.itemSlots.length - 1 ? "disabled" : ""}>▼</button>
        </div>
      </div>`);
    }
    return `<div class="item-slots">${slotsHtml.join("")}</div>`;
  },

  renderBacklog(){
    const st = this.state;
    const cardAction = st.hamstvoDumpMode ? "dump-to-boss-card" : (st.discardMode ? "discard-one-card" : "arm-card");
    const noDrag = st.hamstvoDumpMode || st.discardMode;
    return `<div class="hand-scroll"><div class="hand-row">${st.hand.map(c => {
      const armed = st.pendingPlaceCardId === c.id;
      const modeClass = st.hamstvoDumpMode ? "dumpable" : (st.discardMode ? "discardable" : "");
      return `<div class="backlog-card ${armed ? "armed" : ""} ${modeClass}"
          draggable="${noDrag ? "false" : "true"}" data-action="${cardAction}" data-card-id="${c.id}">
        <div class="card-art type-${c.type}">
          <div class="card-hours-badge">${c.hours}ч</div>
          ${ICONS[c.type]}
        </div>
        <div class="card-body">
          <div class="card-name">${c.name}</div>
          <div class="card-rule"></div>
          <div class="card-numbers"><span class="base">${c.base}</span><span class="mult">+${c.mult}</span></div>
        </div>
      </div>`;
    }).join("")}</div></div>`;
  },

  renderCalendar(){
    const st = this.state;
    const startH = CONFIG.DAY_START_HOUR, endH = CONFIG.DAY_END_HOUR;
    const otInfo = computeOvertime(st.dayPlaced, st.itemSlots);
    const hourStatus = new Map();
    otInfo.freeHours.forEach(h => hourStatus.set(h, "free"));
    otInfo.paidHours.forEach(h => hourStatus.set(h, "paid"));

    let cells = "";
    for (let h = startH; h < endH; h++){
      const rowIdx = (h - startH) + 1;
      let cls = "normal", text = "", droppable = true;
      if (h === CONFIG.LUNCH_HOUR){ cls = "lunch"; text = "обед"; droppable = false; }
      else if (st.dayBlockedHours.has(h)){ cls = "blocked"; text = "недоступно"; droppable = false; }
      else if (h >= CONFIG.OVERTIME_START_HOUR){ cls = "overtime"; text = "переработка"; }

      cells += `<div class="hour-label" style="grid-row:${rowIdx}">${h}:00</div>`;
      cells += `<div class="hour-cell ${cls}" style="grid-row:${rowIdx}" ${droppable ? `data-action="place-here" data-hour="${h}"` : ""}>${text}</div>`;
    }

    if (st.forcedBlock){
      const fb = st.forcedBlock;
      const rowStart = (fb.startHour - startH) + 1;
      cells += `<div class="comm-block" style="grid-row:${rowStart} / span ${fb.hours}" data-action="forced-block-click">
        за усердие батракану назначено общение: ${fb.label}
      </div>`;
    }

    st.dayPlaced.forEach(p => {
      const rowStart = (p.startHour - startH) + 1;
      const paidCount = p.occupiedHours.filter(h => hourStatus.get(h) === "paid").length;
      const otTxt = paidCount > 0 ? `<div class="tb-ot">+${paidCount} Выгорания, +${paidCount} кукишей</div>` : "";
      cells += `<div class="task-block type-${p.card.type}" style="grid-row:${rowStart} / span ${p.card.hours}" data-action="unplace-card" data-card-id="${p.card.id}">
        <div class="tb-main"><span class="tb-name">${p.card.name}</span><span class="tb-nums">${p.card.base} · +${p.card.mult}</span></div>
        ${otTxt}
      </div>`;
    });
    return `<div class="calendar">${cells}</div>`;
  },

  renderHamstvoMenu(){
    const st = this.state;
    const opts = [];
    if (st.forcedBlock) opts.push(`<button data-action="hamstvo-refuse-comm">Отказаться от общения (−2ч приказа)</button>`);
    opts.push(`<button data-action="hamstvo-skip-day">Не сдать день</button>`);
    if (st.hand.length >= 1) opts.push(`<button data-action="toggle-hamstvo-dump-mode">${st.hamstvoDumpMode ? "Отменить спихивание начальнику" : "Спихнуть циферку начальнику"}</button>`);
    return `<div class="row">${opts.join("")}</div>`;
  },

  renderDay(){
    const st = this.state;
    const threshold = CONFIG.THRESHOLDS[st.quarterIndex];
    const preview = computeDayScore(st.dayPlaced.map(p => p.card), st.itemSlots);
    const otPreview = computeOvertime(st.dayPlaced, st.itemSlots);
    const discardLabel = `Спихнуть на соседа (${st.discardsUsedToday}/${CONFIG.DISCARDS_PER_DAY})`;
    const remaining = Math.max(0, threshold - st.quarterScore);
    const remainingDays = CONFIG.DAYS_PER_QUARTER - st.dayIndex;
    const neededToday = remainingDays > 0 ? Math.max(0, Math.ceil(remaining / remainingDays)) : remaining;

    return `
      <h1>Батракан</h1>
      <div class="header-line">Квартал ${st.quarterIndex + 1}/${CONFIG.THRESHOLDS.length} · День ${st.dayIndex + 1}/${CONFIG.DAYS_PER_QUARTER} · ${st.quarterScore} / ${threshold} ·
        До сдачи квартала: ${remaining} · Куда деваться: ${st.kudaDevatsya} · Отметок: ${st.rudeMarks}/${CONFIG.RUDE_MARKS_LIMIT} ·
        День: ${st.dayEffectiveHours}ч · Кукиши: ${st.kukishi}</div>
      ${this.renderItemSlots()}
      <div class="box">
        <h3>Календарь <button data-action="show-legend">?</button></h3>
        <div class="calendar-wrap">${this.renderCalendar()}</div>
        <div class="formula-bar">
          Наколупано ${preview.result} × Замечено ${fmt(preview.vis)} = ${preview.score}
          &nbsp;·&nbsp; Переработка сейчас: ${otPreview.overtimeHours.length}ч, платно: ${otPreview.paidHours.length}ч (+${otPreview.burnout} Выгорания, +${otPreview.kukishi} кукишей)
        </div>
        <div class="hint-line">Чтобы не отстать, сегодня надо около ${neededToday}</div>
        <div class="row"><button data-action="submit-day">Сдать день</button></div>
      </div>
      <div class="box">
        <h3>Рука</h3>
        <div class="row">
          <button data-action="toggle-discard-mode">${discardLabel}</button>
          <button data-action="toggle-hamstvo-menu">Нахамить</button>
        </div>
        ${st.hamstvoMenuOpen ? this.renderHamstvoMenu() : ""}
        ${this.renderBacklog()}
        <div class="row msg">${st.message || ""}</div>
      </div>
      <div class="box">
        <h3>Личное дело</h3>
        ${this.renderLog()}
      </div>
      <div class="footer-line">Seed: ${st.seed} · В колоде: ${st.deck.length} · В руке: ${st.hand.length} · Выгорание: ${st.totalBurnout}</div>
    `;
  },

  renderLog(){
    const st = this.state;
    return st.log.map(entry => {
      if (entry.type === "quarter-start"){
        return `<div class="log-entry"><b>— Квартал ${entry.quarter} начался. Порог: ${entry.threshold} —</b></div>`;
      }
      if (entry.type === "comm-order"){
        return `<div class="log-entry lore">За усердие батракану назначено общение: ${entry.flavor}.</div>`;
      }
      if (entry.type === "day-start"){
        const blockedTxt = entry.blocked.length ? entry.blocked.join(", ") + ":00" : "нет";
        return `<div class="log-entry">Квартал ${entry.quarter}, ${entry.weekday}. Недоступно из-за Выгорания: ${blockedTxt}.</div>`;
      }
      if (entry.type === "discard"){
        const list = entry.cards.map(c => c.name).join("; ");
        return `<div class="log-entry">Спихнуто (${entry.used}/${CONFIG.DISCARDS_PER_DAY}): ${list}</div>`;
      }
      if (entry.type === "day-end"){
        const s = entry.scoreInfo, ot = entry.otInfo;
        const cardsList = entry.cards.map(c => `${c.name} (Н${c.base}, З${c.mult}, ${c.hours}ч, ${c.sizeLabel})`).join("; ") || "нет циферок";
        const stepsList = s.steps.length
          ? s.steps.map(st2 => st2.broken
              ? st2.name + ": истаяло, эффект не применён"
              : st2.name + ": Наколупано " + st2.before.result + "→" + st2.after.result + ", Замечено " + fmt(st2.before.vis) + "→" + fmt(st2.after.vis)
            ).join("<br>")
          : "нет";
        const kudaTxt = ` · Куда деваться +${entry.emptyHours} (итого ${st.kudaDevatsya})`;
        return `<div class="log-entry">
          <b>Квартал ${entry.quarter}, ${CONFIG.WEEKDAYS[entry.day - 1]}: день сдан</b><br>
          Циферки: ${cardsList}<br>
          Наколупано (сумма): ${s.resultBase} · Замечено (сумма): ${s.visBase}<br>
          Предметы (по порядку слотов):<br>${stepsList}<br>
          Итог дня: ${s.result} × ${fmt(s.vis)} = <b>${s.score}</b><br>
          Переработка: ${ot.overtimeHours.join(", ") || "нет"} · платно: ${ot.paidHours.join(", ") || "—"} → +${ot.burnout} Выгорания, +${ot.kukishi} кукишей${kudaTxt}<br>
          Накоплено в квартале: ${entry.runningTotal}
        </div>`;
      }
      if (entry.type === "onetime-item"){
        const dayTxt = entry.eatsDay ? "день съеден целиком" : "день не тронут";
        return `<div class="log-entry">Применено «${entry.name}»: Выгорание ${entry.before} → ${entry.after}, ${dayTxt}.</div>`;
      }
      if (entry.type === "quarter-end"){
        return `<div class="log-entry"><b>Квартал ${entry.quarter} завершён: ${entry.score} / ${entry.threshold} — ${entry.passed ? "порог взят" : "порог НЕ взят"}</b></div>`;
      }
      if (entry.type === "rude"){
        return `<div class="log-entry">Хамство (отметка ${entry.marks}/${CONFIG.RUDE_MARKS_LIMIT}): ${entry.note}.</div>`;
      }
      if (entry.type === "force-majeure"){
        const choiceTxt = entry.choice === "help"
          ? "подсобил, сдвиг +" + entry.hoursEaten + "ч" + (entry.burned.length ? ", сгорело: " + entry.burned.join(", ") : "")
          : "нахамил";
        return `<div class="log-entry">Форс-мажор «${entry.label}»: ${choiceTxt}.</div>`;
      }
      return "";
    }).join("");
  },

  renderShop(){
    const st = this.state;
    const offers = st.shopOffers.map((offer, idx) => {
      const def = itemDef(offer.id);
      const canBuy = !offer.bought && st.kukishi >= def.price && st.itemSlots.length < CONFIG.MAX_ITEM_SLOTS;
      return `<div class="backlog-card" style="width:260px;height:auto;display:inline-block;vertical-align:top;margin-right:8px;margin-bottom:8px;">
        <b>${def.name}</b> (цена: ${def.price})<br>
        <span class="small">${def.desc}</span><br>
        <button data-action="buy-item" data-offer-idx="${idx}" ${canBuy ? "" : "disabled"}>${offer.bought ? "Куплено" : "Купить"}</button>
      </div>`;
    }).join("");

    return `
      <div class="paper-screen">
        <div class="paper-title">КОНТОРКА</div>
        <div class="paper-line">Кукиши: ${st.kukishi} · Слоты: ${st.itemSlots.length} / ${CONFIG.MAX_ITEM_SLOTS} <button data-action="show-legend">?</button></div>
        <div class="paper-line msg">${st.message || ""}</div>
        <div class="paper-line"><b>Предложения</b><br>${offers}</div>
        <div class="paper-line">${this.renderItemSlots()}</div>
        <div class="paper-line"><button data-action="continue-shop">Дальше (квартал ${st.quarterIndex + 2})</button></div>
        <div class="paper-line"><b>Личное дело</b>${this.renderLog()}</div>
      </div>
    `;
  },

  renderGameOverEarly(){
    const st = this.state;
    return `
      <div class="paper-screen">
        ${this.renderStamp("ВЫЧЕРКНУТ")}
        <div class="paper-title">БАТРАКАН</div>
        <table class="paper-table">
          <tr><td>Квартал</td><td>${st.quarterIndex + 1}</td></tr>
          <tr><td>Счёт</td><td>${st.quarterScore} / ${CONFIG.THRESHOLDS[st.quarterIndex]}</td></tr>
          <tr><td>Выгорание</td><td>${st.totalBurnout}</td></tr>
          <tr><td>Кукиши</td><td>${st.kukishi}</td></tr>
          <tr><td>Куда деваться</td><td>${st.kudaDevatsya}</td></tr>
          <tr><td>Seed</td><td>${st.seed}</td></tr>
        </table>
        <div class="paper-line"><button data-action="restart">Играть заново</button></div>
        <div class="paper-line"><b>Личное дело</b>${this.renderLog()}</div>

      ${this.renderSubtitle("Порог не взят. Шабашка кончилась, не дотянув до положенного. Контора этого не заметила — циферки не различают уставших.")}
    `;
  },

  renderFinale(){
    const st = this.state;
    const middle = st.finaleEnough
      ? "У батракана находится, что ответить. Он поднимается и уходит из конторки, не оборачиваясь."
      : "Батракан молчит. Сказать-то и нечего.";
    return `
      <div class="paper-screen">
        ${this.renderStamp("ВЫЧЕРКНУТ")}
        <div class="paper-title">БАТРАКАН</div>
        <table class="paper-table">
          <tr><td>Квартал 5</td><td>${st.quarterScore} / ${CONFIG.THRESHOLDS[4]} (${st.finalePassedThreshold ? "порог взят" : "порог не взят"})</td></tr>
          <tr><td>Выгорание</td><td>${st.totalBurnout}</td></tr>
          <tr><td>Кукиши</td><td>${st.kukishi}</td></tr>
          <tr><td>Куда деваться</td><td>${st.kudaDevatsya} (порог финала: ${CONFIG.FINALE_THRESHOLD})</td></tr>
          <tr><td>Seed</td><td>${st.seed}</td></tr>
        </table>
        <div class="paper-line"><button data-action="restart">Играть заново</button></div>
        <div class="paper-line"><b>Личное дело</b>${this.renderLog()}</div>
      </div>
      ${this.renderSubtitle("Кудесница Алеся достаёт личное дело батракана, глядит в него долго и спрашивает ласково: «Покуда же ты денешься без шабашки?» " + middle + " Наутро на его месте сидит другой батракан — да отзывается на то же самое имя.")}
    `;
  },

  renderVycherknutMarks(){
    const st = this.state;
    return `
      <div class="paper-screen">
        ${this.renderStamp("ВЫЧЕРКНУТ")}
        <div class="paper-title">БАТРАКАН</div>
        <table class="paper-table">
          <tr><td>Квартал</td><td>${st.quarterIndex + 1}</td></tr>
          <tr><td>Отметок</td><td>${st.rudeMarks}/${CONFIG.RUDE_MARKS_LIMIT}</td></tr>
          <tr><td>Счёт квартала</td><td>${st.quarterScore} / ${CONFIG.THRESHOLDS[st.quarterIndex]}</td></tr>
          <tr><td>Выгорание</td><td>${st.totalBurnout}</td></tr>
          <tr><td>Кукиши</td><td>${st.kukishi}</td></tr>
          <tr><td>Куда деваться</td><td>${st.kudaDevatsya}</td></tr>
          <tr><td>Seed</td><td>${st.seed}</td></tr>
        </table>
        <div class="paper-line"><button data-action="restart">Играть заново</button></div>
        <div class="paper-line"><b>Личное дело</b>${this.renderLog()}</div>
      </div>
      ${this.renderSubtitle("Ну Алеся имя и вычеркнула, дело прикрыла, да и батракан сгинул, будто не бывало. А на утро на его месте другой батракан сидит, да на то же имя откликается.")}
    `;
  }
};

/* ======================= EVENTS ======================= */
document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "start-run"){
    const input = document.getElementById("seedInput");
    App.startRun(input ? input.value : "");
  } else if (action === "acknowledge-order"){
    App.acknowledgeOrder();
  } else if (action === "begin-day"){
    App.beginDay();
  } else if (action === "continue-day-outro"){
    App.continueAfterDayOutro();
  } else if (action === "arm-card"){
    App.armCard(el.dataset.cardId);
  } else if (action === "toggle-discard-mode"){
    App.toggleDiscardMode();
  } else if (action === "discard-one-card"){
    App.discardOneCard(el.dataset.cardId);
  } else if (action === "toggle-hamstvo-menu"){
    App.toggleHamstvoMenu();
  } else if (action === "hamstvo-refuse-comm"){
    App.hamstvoRefuseComm();
  } else if (action === "hamstvo-skip-day"){
    App.hamstvoSkipDay();
  } else if (action === "toggle-hamstvo-dump-mode"){
    App.toggleHamstvoDumpMode();
  } else if (action === "dump-to-boss-card"){
    App.hamstvoDumpCard(el.dataset.cardId);
  } else if (action === "force-majeure-help"){
    App.forceMajeureHelp();
  } else if (action === "force-majeure-rude"){
    App.forceMajeureRude();
  } else if (action === "place-here"){
    App.onCellClick(Number(el.dataset.hour));
  } else if (action === "unplace-card"){
    App.unplaceCard(el.dataset.cardId);
  } else if (action === "forced-block-click"){
    App.onForcedBlockClick();
  } else if (action === "submit-day"){
    App.submitDay();
  } else if (action === "use-item"){
    App.useOneTimeItem(Number(el.dataset.slotIdx));
  } else if (action === "buy-item"){
    App.buyItem(Number(el.dataset.offerIdx));
  } else if (action === "continue-shop"){
    App.continueToNextQuarter();
  } else if (action === "move-item-up"){
    App.moveItemSlot(Number(el.dataset.slotIdx), -1);
  } else if (action === "move-item-down"){
    App.moveItemSlot(Number(el.dataset.slotIdx), 1);
  } else if (action === "restart"){
    App.restart();
  } else if (action === "show-legend"){
    App.state.showLegend = true; App.render();
  } else if (action === "close-legend"){
    App.state.showLegend = false; App.render();
  }
});

document.addEventListener("dragstart", function(e){
  const el = e.target.closest('[draggable="true"]');
  if (!el) return;
  e.dataTransfer.setData("text/plain", el.dataset.cardId);
});
document.addEventListener("dragover", function(e){
  const el = e.target.closest('[data-action="place-here"]');
  if (!el) return;
  e.preventDefault();
});
document.addEventListener("drop", function(e){
  const el = e.target.closest('[data-action="place-here"]');
  if (!el) return;
  e.preventDefault();
  const cardId = e.dataTransfer.getData("text/plain");
  App.handleDrop(cardId, Number(el.dataset.hour));
});

App.init();
})();
</script>
</body>
</html>
