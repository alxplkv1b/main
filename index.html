<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Батракан</title>
<style>
  body{font-family:monospace;font-size:14px;margin:16px;}
  .box{border:1px solid #000;padding:8px;margin-bottom:10px;}
  .card{border:1px solid #000;display:inline-block;width:190px;padding:5px;margin:3px;vertical-align:top;font-size:12px;}
  .card label{cursor:pointer;}
  .row{margin-bottom:6px;}
  button{font-family:monospace;margin-right:6px;padding:2px 10px;cursor:pointer;}
  button:disabled{cursor:default;opacity:0.5;}
  input[type=text]{font-family:monospace;padding:2px;}
  .log-entry{border-top:1px dashed #000;padding:6px 0;}
  .cols{display:flex;gap:16px;flex-wrap:wrap;}
  .col{flex:1;min-width:320px;}
  .small{font-size:11px;}
  .msg{font-weight:bold;}
  table{border-collapse:collapse;}
  td,th{border:1px solid #000;padding:2px 6px;font-size:12px;text-align:left;}
  h1,h2,h3{margin:6px 0;}
  ul{margin:4px 0;padding-left:18px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
"use strict";

/* ======================= CONFIG ======================= */
const CONFIG = {
  HAND_SIZE: 8,
  MAX_PLAY: 5,
  BASE_DISCARDS: 3,
  MAX_JOKER_SLOTS: 5,
  SHOP_SIZE: 3,
  HR_ACTIVE_QUARTERS: 3, // "Друг в HR" работает столько кварталов подряд, потом ломается

  THRESHOLDS: [300, 800, 2000, 5000, 12000],

  PROJECTS: ["Атлас", "Феникс", "Орион", "Незабудка"],

  TYPES: [
    {
      key: "dev", label: "Разработка",
      resultRange: [35, 60], visRange: [1, 2],
      names: [
        "Написать модуль", "Зарефакторить сервис", "Пофиксить критический баг",
        "Задеплоить релиз", "Написать unit-тесты", "Настроить CI/CD",
        "Провести код-ревью", "Оптимизировать запрос к базе",
        "Мигрировать на новую версию", "Собрать прототип фичи"
      ]
    },
    {
      key: "meeting", label: "Встреча",
      resultRange: [10, 20], visRange: [3, 4],
      names: [
        "Синхрон по статусу", "Ретро квартала", "Встреча с заказчиком",
        "Планирование спринта", "1-на-1 с руководителем", "Демо для стейкхолдеров",
        "Созвон с подрядчиком", "Обсуждение бюджета", "Общий брифинг отдела",
        "Митинг «на всякий случай»"
      ]
    },
    {
      key: "report", label: "Отчёт",
      resultRange: [20, 35], visRange: [2, 3],
      names: [
        "Отчёт по прогрессу", "Презентация для дирекции", "Сводка по рискам",
        "Квартальный отчёт", "Отчёт в OKR-систему", "Аналитика по метрикам",
        "Отчёт для аудита", "Пост-мортем инцидента", "Отчёт по бюджету проекта",
        "Итоговая презентация"
      ]
    },
    {
      key: "mail", label: "Переписка",
      resultRange: [10, 15], visRange: [4, 5],
      names: [
        "Ответить в переписке", "Уточнить детали по почте", "Согласовать в чате",
        "Разослать напоминание", "Ответить всем (Reply All)", "Уточнить статус в Slack",
        "Переслать письмо «на всякий случай»", "Согласование по email",
        "Написать саммари в чат", "Поставить в копию (CC)"
      ]
    }
  ],

  COMBOS: {
    focus:     { name: "Фокус",          bonus: 4, desc: "3+ задачи одного проекта в сыгранной руке" },
    multitask: { name: "Многостаночник", bonus: 6, desc: "4 разных типа задач в сыгранной руке" },
    lonewolf:  { name: "Один в поле",    bonus: 8, desc: "ровно 1 задача с Результатом 50+ в руке" }
  },

  JOKERS: [
    { id: "cc",     name: "Ты в копии",              price: 3, desc: "+2 Видимости за каждую сыгранную задачу типа «Переписка»." },
    { id: "toxic",  name: "Токсичный техлид",        price: 4, desc: "+15 Результата, но −1 Видимости за каждую сыгранную «Встречу»." },
    { id: "hr",     name: "Друг в HR",               price: 6, desc: "×1.5 к итоговой Видимости руки. Ломается после " + 3 + " кварталов работы." },
    { id: "jira",   name: "Джира",                   price: 3, desc: "+1 сброс («делегирование») за раунд." },
    { id: "friday", name: "Созвон в пятницу 18:00",  price: 5, desc: "+25 Результата, если сыграно ровно 5 задач." }
  ]
};

// Собираем колоду из 40 карт-задач по шаблонам выше (все числа берутся из CONFIG.TYPES).
CONFIG.CARDS = (function buildCards(){
  const list = [];
  CONFIG.TYPES.forEach(type => {
    const n = type.names.length;
    type.names.forEach((name, i) => {
      const project = CONFIG.PROJECTS[i % CONFIG.PROJECTS.length];
      const rSpan = type.resultRange[1] - type.resultRange[0];
      const result = type.resultRange[0] + Math.round(rSpan * (i / (n - 1)));
      const vSpan = type.visRange[1] - type.visRange[0];
      const vis = type.visRange[0] + (vSpan > 0 ? (i % (vSpan + 1)) : 0);
      list.push({ id: type.key + "_" + i, name, project, type: type.key, result, vis });
    });
  });
  return list;
})();

function typeLabel(key){
  const t = CONFIG.TYPES.find(t => t.key === key);
  return t ? t.label : key;
}
function jokerDef(id){
  return CONFIG.JOKERS.find(j => j.id === id);
}

/* ======================= RNG ======================= */
function hashStringToInt(str){
  let h = 0;
  for (let i = 0; i < str.length; i++){
    h = (Math.imul(31, h) + str.charCodeAt(i)) | 0;
  }
  return h >>> 0;
}
function resolveSeed(input){
  const trimmed = (input || "").trim();
  if (trimmed === "") return (Date.now() % 4294967296) >>> 0;
  if (/^\d+$/.test(trimmed)) return Number(trimmed) >>> 0;
  return hashStringToInt(trimmed);
}
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function shuffle(arr, rng){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rng() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

/* ======================= SCORING ======================= */
function isJokerActive(slot){
  if (slot.id === "hr") return slot.quartersUsed <= CONFIG.HR_ACTIVE_QUARTERS;
  return true;
}

function computeHandScore(playedCards, jokerSlots){
  const resultBase = playedCards.reduce((s, c) => s + c.result, 0);
  const visBase = playedCards.reduce((s, c) => s + c.vis, 0);

  let result = resultBase;
  let vis = visBase;
  const combos = [];

  const byProject = {};
  playedCards.forEach(c => byProject[c.project] = (byProject[c.project] || 0) + 1);
  if (Object.values(byProject).some(n => n >= 3)){
    vis += CONFIG.COMBOS.focus.bonus;
    combos.push({ name: CONFIG.COMBOS.focus.name, bonus: CONFIG.COMBOS.focus.bonus });
  }
  const distinctTypes = new Set(playedCards.map(c => c.type)).size;
  if (distinctTypes >= 4){
    vis += CONFIG.COMBOS.multitask.bonus;
    combos.push({ name: CONFIG.COMBOS.multitask.name, bonus: CONFIG.COMBOS.multitask.bonus });
  }
  const highCount = playedCards.filter(c => c.result >= 50).length;
  if (highCount === 1){
    vis += CONFIG.COMBOS.lonewolf.bonus;
    combos.push({ name: CONFIG.COMBOS.lonewolf.name, bonus: CONFIG.COMBOS.lonewolf.bonus });
  }

  const steps = [];
  jokerSlots.forEach(slot => {
    if (!slot) return;
    const def = jokerDef(slot.id);
    if (slot.id === "jira") return; // не влияет на подсчёт очков напрямую
    if (slot.id === "hr" && !isJokerActive(slot)){
      steps.push({ name: def.name, broken: true });
      return;
    }
    const before = { result, vis };
    if (slot.id === "cc"){
      const cnt = playedCards.filter(c => c.type === "mail").length;
      vis += 2 * cnt;
    } else if (slot.id === "toxic"){
      result += 15;
      const cnt = playedCards.filter(c => c.type === "meeting").length;
      vis -= cnt;
    } else if (slot.id === "friday"){
      if (playedCards.length === 5) result += 25;
    } else if (slot.id === "hr"){
      vis *= 1.5;
    }
    steps.push({ name: def.name, before, after: { result, vis } });
  });

  const score = Math.round(result * vis);
  return { resultBase, visBase, combos, steps, result, vis, score };
}

/* ======================= APP STATE / LOGIC ======================= */
const App = {
  state: null,

  init(){
    this.state = { screen: "start", seedText: String(Date.now() % 100000) };
    this.render();
  },

  startRun(seedInput){
    const seed = resolveSeed(seedInput);
    this.state = {
      screen: "quarter",
      seedInput: seedInput,
      seed: seed,
      rng: mulberry32(seed),
      quarterIndex: 0,
      currency: 0,
      jokerSlots: [],
      log: [],
      message: ""
    };
    this.newQuarter();
    this.render();
  },

  newQuarter(){
    const st = this.state;
    st.deck = shuffle(CONFIG.CARDS, st.rng);
    st.discardPile = [];
    st.playedPile = [];
    st.hand = [];
    st.selected = new Set();
    st.discardsUsed = 0;
    st.quarterScore = 0;
    st.message = "";

    st.jokerSlots.forEach(slot => {
      if (slot.id === "hr" && slot.quartersUsed <= CONFIG.HR_ACTIVE_QUARTERS){
        slot.quartersUsed++;
      }
    });

    const jiraCount = st.jokerSlots.filter(s => s.id === "jira").length;
    st.discardsAllowed = CONFIG.BASE_DISCARDS + jiraCount;

    st.log.unshift({ type: "quarter-start", quarter: st.quarterIndex + 1, threshold: CONFIG.THRESHOLDS[st.quarterIndex] });

    this.dealHand();
  },

  dealHand(){
    const st = this.state;
    while (st.hand.length < CONFIG.HAND_SIZE && st.deck.length > 0){
      st.hand.push(st.deck.shift());
    }
  },

  toggleSelect(cardId){
    const st = this.state;
    if (st.selected.has(cardId)) st.selected.delete(cardId);
    else st.selected.add(cardId);
    this.render();
  },

  playHand(){
    const st = this.state;
    const played = st.hand.filter(c => st.selected.has(c.id));
    if (played.length < 1 || played.length > CONFIG.MAX_PLAY){
      st.message = "Выбери от 1 до " + CONFIG.MAX_PLAY + " задач, чтобы сыграть.";
      this.render();
      return;
    }
    const scoreInfo = computeHandScore(played, st.jokerSlots);
    st.quarterScore += scoreInfo.score;
    st.playedPile.push(...played);
    st.hand = st.hand.filter(c => !st.selected.has(c.id));
    st.selected = new Set();
    st.message = "";
    st.log.unshift({ type: "hand", quarter: st.quarterIndex + 1, played, scoreInfo, runningTotal: st.quarterScore });

    this.dealHand();
    this.checkQuarterEnd();
    this.render();
  },

  discardHand(){
    const st = this.state;
    const chosen = st.hand.filter(c => st.selected.has(c.id));
    if (chosen.length < 1){
      st.message = "Выбери хотя бы одну задачу для делегирования.";
      this.render();
      return;
    }
    if (st.discardsUsed >= st.discardsAllowed){
      st.message = "Делегирования на этот квартал закончились.";
      this.render();
      return;
    }
    st.discardPile.push(...chosen);
    st.hand = st.hand.filter(c => !st.selected.has(c.id));
    st.selected = new Set();
    st.discardsUsed++;
    st.message = "";
    st.log.unshift({ type: "discard", quarter: st.quarterIndex + 1, cards: chosen, discardsUsed: st.discardsUsed, discardsAllowed: st.discardsAllowed });

    this.dealHand();
    this.checkQuarterEnd();
    this.render();
  },

  checkQuarterEnd(){
    const st = this.state;
    if (st.deck.length === 0 && st.hand.length === 0){
      this.endQuarter();
    }
  },

  endQuarter(){
    const st = this.state;
    const threshold = CONFIG.THRESHOLDS[st.quarterIndex];
    const passed = st.quarterScore >= threshold;
    st.log.unshift({ type: "quarter-end", quarter: st.quarterIndex + 1, threshold, score: st.quarterScore, passed });

    if (!passed){
      st.screen = "gameover";
      return;
    }

    const premium = Math.floor((st.quarterScore - threshold) / 100);
    st.currency += premium;
    st.log.unshift({ type: "premium", quarter: st.quarterIndex + 1, premium, currency: st.currency });

    if (st.quarterIndex === CONFIG.THRESHOLDS.length - 1){
      st.screen = "victory";
      return;
    }

    st.shopOffers = Array.from({ length: CONFIG.SHOP_SIZE }, () => {
      const def = CONFIG.JOKERS[Math.floor(st.rng() * CONFIG.JOKERS.length)];
      return { id: def.id, bought: false };
    });
    st.screen = "shop";
  },

  buyJoker(offerIdx){
    const st = this.state;
    const offer = st.shopOffers[offerIdx];
    if (!offer || offer.bought) return;
    const def = jokerDef(offer.id);
    if (st.currency < def.price){
      st.message = "Не хватает премии.";
      this.render();
      return;
    }
    if (st.jokerSlots.length >= CONFIG.MAX_JOKER_SLOTS){
      st.message = "Все слоты джокеров заняты.";
      this.render();
      return;
    }
    st.currency -= def.price;
    st.jokerSlots.push({ id: def.id, quartersUsed: 0 });
    offer.bought = true;
    st.message = "";
    this.render();
  },

  moveJokerSlot(idx, dir){
    const st = this.state;
    const j = idx + dir;
    if (j < 0 || j >= st.jokerSlots.length) return;
    const tmp = st.jokerSlots[idx];
    st.jokerSlots[idx] = st.jokerSlots[j];
    st.jokerSlots[j] = tmp;
    this.render();
  },

  continueToNextQuarter(){
    const st = this.state;
    st.quarterIndex++;
    st.screen = "quarter";
    this.newQuarter();
    this.render();
  },

  restart(){
    this.init();
  },

  /* ======================= RENDER ======================= */
  render(){
    const st = this.state;
    let html = "";
    if (st.screen === "start") html = this.renderStart();
    else if (st.screen === "quarter") html = this.renderQuarter();
    else if (st.screen === "shop") html = this.renderShop();
    else if (st.screen === "gameover") html = this.renderEnd(false);
    else if (st.screen === "victory") html = this.renderEnd(true);
    document.getElementById("app").innerHTML = html;
  },

  renderStart(){
    const st = this.state;
    return `
      <h1>Батракан</h1>
      <div class="box">
        <p>Офисный деклбилдер. Закрывай задачи за квартал, набирай очки.</p>
        <p>Очки = Результат × Видимость. Пороги по кварталам: ${CONFIG.THRESHOLDS.join(", ")}.</p>
      </div>
      <div class="box">
        <div class="row">Seed (число или любой текст, можно оставить пустым):</div>
        <div class="row"><input type="text" id="seedInput" value="${st.seedText}"></div>
        <button data-action="start-run">Начать забег</button>
      </div>
    `;
  },

  renderJokerSlots(){
    const st = this.state;
    if (st.jokerSlots.length === 0) return "<div class=\"small\">Джокеров пока нет.</div>";
    let rows = st.jokerSlots.map((slot, idx) => {
      const def = jokerDef(slot.id);
      let status = "";
      if (slot.id === "hr"){
        status = isJokerActive(slot)
          ? " (квартал " + slot.quartersUsed + "/" + CONFIG.HR_ACTIVE_QUARTERS + ")"
          : " — СЛОМАН";
      }
      return `<tr>
        <td>${idx + 1}</td>
        <td>${def.name}${status}</td>
        <td class="small">${def.desc}</td>
        <td>
          <button data-action="move-joker-up" data-slot-idx="${idx}" ${idx === 0 ? "disabled" : ""}>▲</button>
          <button data-action="move-joker-down" data-slot-idx="${idx}" ${idx === st.jokerSlots.length - 1 ? "disabled" : ""}>▼</button>
        </td>
      </tr>`;
    }).join("");
    return `<table><tr><th>#</th><th>Джокер</th><th>Эффект</th><th>Порядок</th></tr>${rows}</table>`;
  },

  renderCard(card, selected){
    return `<div class="card">
      <label>
        <input type="checkbox" data-action="toggle-select" data-card-id="${card.id}" ${selected ? "checked" : ""}>
        <b>${card.name}</b><br>
        Проект: ${card.project}<br>
        Тип: ${typeLabel(card.type)}<br>
        Результат: ${card.result} · Видимость: ${card.vis}
      </label>
    </div>`;
  },

  renderQuarter(){
    const st = this.state;
    const threshold = CONFIG.THRESHOLDS[st.quarterIndex];
    const cards = st.hand.map(c => this.renderCard(c, st.selected.has(c.id))).join("");

    return `
      <h1>Батракан</h1>
      <div class="cols">
        <div class="col">
          <div class="box">
            <div class="row">Квартал: ${st.quarterIndex + 1} / ${CONFIG.THRESHOLDS.length} · Порог: ${threshold}</div>
            <div class="row">Набрано в квартале: <b>${st.quarterScore}</b></div>
            <div class="row">Премия (валюта): ${st.currency} · Seed: ${st.seed}</div>
            <div class="row">Делегирований: ${st.discardsUsed} / ${st.discardsAllowed} · В колоде: ${st.deck.length} · В сбросе: ${st.discardPile.length}</div>
          </div>
          <div class="box">
            <h3>Джокеры</h3>
            ${this.renderJokerSlots()}
          </div>
          <div class="box">
            <h3>Рука (${st.hand.length})</h3>
            ${cards}
            <div class="row msg">${st.message || ""}</div>
            <div class="row">
              <button data-action="play-hand">Играть выбранные (макс. ${CONFIG.MAX_PLAY})</button>
              <button data-action="discard-hand">Делегировать выбранные</button>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="box">
            <h3>Журнал</h3>
            ${this.renderLog()}
          </div>
        </div>
      </div>
    `;
  },

  renderLog(){
    const st = this.state;
    return st.log.map(entry => {
      if (entry.type === "quarter-start"){
        return `<div class="log-entry"><b>— Квартал ${entry.quarter} начался. Порог: ${entry.threshold} —</b></div>`;
      }
      if (entry.type === "hand"){
        const cardsList = entry.played.map(c => `${c.name} (Рез. ${c.result}, Вид. ${c.vis}, ${c.project}, ${typeLabel(c.type)})`).join("; ");
        const s = entry.scoreInfo;
        const combosList = s.combos.length
          ? s.combos.map(c => c.name + " (+" + c.bonus + " Вид.)").join(", ")
          : "нет";
        const stepsList = s.steps.length
          ? s.steps.map(st2 => st2.broken
              ? st2.name + ": сломан, эффект не применён"
              : st2.name + ": Рез. " + st2.before.result + "→" + st2.after.result + ", Вид. " + fmt(st2.before.vis) + "→" + fmt(st2.after.vis)
            ).join("<br>")
          : "нет";
        return `<div class="log-entry">
          <b>Квартал ${entry.quarter}: сыграна рука</b><br>
          Карты: ${cardsList}<br>
          Результат (сумма карт): ${s.resultBase} · Видимость (сумма карт): ${s.visBase}<br>
          Комбо: ${combosList}<br>
          Джокеры (по порядку слотов):<br>${stepsList}<br>
          Итог руки: ${s.result} × ${fmt(s.vis)} = <b>${s.score}</b><br>
          Накоплено в квартале: ${entry.runningTotal}
        </div>`;
      }
      if (entry.type === "discard"){
        const cardsList = entry.cards.map(c => c.name).join("; ");
        return `<div class="log-entry">Делегировано (${entry.discardsUsed}/${entry.discardsAllowed}): ${cardsList}</div>`;
      }
      if (entry.type === "quarter-end"){
        return `<div class="log-entry"><b>Квартал ${entry.quarter} завершён: ${entry.score} / ${entry.threshold} — ${entry.passed ? "порог пройден" : "порог НЕ пройден"}</b></div>`;
      }
      if (entry.type === "premium"){
        return `<div class="log-entry">Премия за квартал ${entry.quarter}: +${entry.premium}. Баланс: ${entry.currency}</div>`;
      }
      return "";
    }).join("");
  },

  renderShop(){
    const st = this.state;
    const offers = st.shopOffers.map((offer, idx) => {
      const def = jokerDef(offer.id);
      const canBuy = !offer.bought && st.currency >= def.price && st.jokerSlots.length < CONFIG.MAX_JOKER_SLOTS;
      return `<div class="card" style="width:260px">
        <b>${def.name}</b> (цена: ${def.price})<br>
        <span class="small">${def.desc}</span><br>
        <button data-action="buy-joker" data-offer-idx="${idx}" ${canBuy ? "" : "disabled"}>${offer.bought ? "Куплено" : "Купить"}</button>
      </div>`;
    }).join("");

    return `
      <h1>Батракан — Магазин</h1>
      <div class="cols">
        <div class="col">
          <div class="box">
            <div class="row">Премия: ${st.currency} · Слоты джокеров: ${st.jokerSlots.length} / ${CONFIG.MAX_JOKER_SLOTS}</div>
            <div class="row msg">${st.message || ""}</div>
          </div>
          <div class="box">
            <h3>Предложения</h3>
            ${offers}
          </div>
          <div class="box">
            <h3>Твои джокеры</h3>
            ${this.renderJokerSlots()}
          </div>
          <div class="box">
            <button data-action="continue-shop">Дальше (квартал ${st.quarterIndex + 2})</button>
          </div>
        </div>
        <div class="col">
          <div class="box">
            <h3>Журнал</h3>
            ${this.renderLog()}
          </div>
        </div>
      </div>
    `;
  },

  renderEnd(won){
    const st = this.state;
    return `
      <h1>Батракан — ${won ? "Забег пройден!" : "Конец забега"}</h1>
      <div class="box">
        <div class="row">${won ? "Все 5 кварталов пройдены." : "Порог квартала " + (st.quarterIndex + 1) + " не пройден."}</div>
        <div class="row">Итоговая премия: ${st.currency} · Seed: ${st.seed}</div>
        <button data-action="restart">Играть заново</button>
      </div>
      <div class="box">
        <h3>Журнал</h3>
        ${this.renderLog()}
      </div>
    `;
  }
};

function fmt(n){
  return Math.round(n * 100) / 100;
}

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  if (action === "start-run"){
    const input = document.getElementById("seedInput");
    App.startRun(input ? input.value : "");
  } else if (action === "toggle-select"){
    App.toggleSelect(el.dataset.cardId);
  } else if (action === "play-hand"){
    App.playHand();
  } else if (action === "discard-hand"){
    App.discardHand();
  } else if (action === "buy-joker"){
    App.buyJoker(Number(el.dataset.offerIdx));
  } else if (action === "continue-shop"){
    App.continueToNextQuarter();
  } else if (action === "move-joker-up"){
    App.moveJokerSlot(Number(el.dataset.slotIdx), -1);
  } else if (action === "move-joker-down"){
    App.moveJokerSlot(Number(el.dataset.slotIdx), 1);
  } else if (action === "restart"){
    App.restart();
  }
});

App.init();
})();
</script>
</body>
</html>
